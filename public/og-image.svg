<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(59,130,246,0.5)"/>
      <stop offset="50%" stop-color="rgba(6,182,212,0.3)"/>
      <stop offset="100%" stop-color="rgba(16,185,129,0.2)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient Glows -->
  <circle cx="200" cy="150" r="220" fill="#2563EB" opacity="0.18" filter="url(#glow)"/>
  <circle cx="1000" cy="480" r="260" fill="#06B6D4" opacity="0.14" filter="url(#glow)"/>

  <!-- Decorative Border Frame -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Brand Monogram Box -->
  <rect x="90" y="90" width="70" height="70" rx="18" fill="#0F172A" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <text x="125" y="137" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="url(#textGrad)" text-anchor="middle">MA</text>

  <!-- Status Pill -->
  <rect x="180" y="105" width="220" height="40" rx="20" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <circle cx="202" cy="125" r="5" fill="#10B981"/>
  <text x="220" y="130" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#34D399">Available for Senior Roles</text>

  <!-- Main Headline -->
  <text x="90" y="240" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="54" fill="#FFFFFF" letter-spacing="-1">Muneeb Amin</text>
  <text x="90" y="300" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="34" fill="url(#textGrad)" letter-spacing="-0.5">Full Stack Developer &amp; Software Architect</text>

  <!-- Subtitle -->
  <text x="90" y="365" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="20" fill="#94A3B8">Building scalable, responsive, and high-performance web applications</text>
  <text x="90" y="398" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="20" fill="#94A3B8">using React.js, Redux Toolkit, Django REST, Node.js, and SQL databases.</text>

  <!-- Tech Tags -->
  <g transform="translate(90, 460)">
    <rect x="0" y="0" width="105" height="42" rx="10" fill="#0F172A" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="52" y="26" font-family="monospace" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">React.js</text>

    <rect x="115" y="0" width="135" height="42" rx="10" fill="#0F172A" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="182" y="26" font-family="monospace" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">Redux Toolkit</text>

    <rect x="260" y="0" width="135" height="42" rx="10" fill="#0F172A" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="327" y="26" font-family="monospace" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">Django REST</text>

    <rect x="405" y="0" width="105" height="42" rx="10" fill="#0F172A" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="457" y="26" font-family="monospace" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">Node.js</text>

    <rect x="520" y="0" width="125" height="42" rx="10" fill="#0F172A" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="582" y="26" font-family="monospace" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">PostgreSQL</text>

    <rect x="655" y="0" width="135" height="42" rx="10" fill="#0F172A" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="722" y="26" font-family="monospace" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">Tailwind CSS</text>
  </g>

  <!-- URL watermark -->
  <text x="1100" y="555" font-family="monospace" font-size="14" fill="#64748B" text-anchor="end">muneebamin.dev</text>
</svg>
